schema: 2
package: SynoPkgConvertX
version: 0.20.0
build: 9
displayname: ConvertX
icon: assets/icon.png
description: Convert documents, images, audio and video between file formats
maintainer: Emrik Östling
metadata:
  changelog: {"en": "Store temporary conversion files on disk instead of memory", "zh-TW": "轉換用的暫存檔改存於磁碟而非記憶體", "zh-CN": "转换用的临时文件改存于磁盘而非内存", "ja": "変換用の一時ファイルをメモリではなくディスクに保存", "ko": "변환 임시 파일을 메모리 대신 디스크에 저장", "de": "Temporäre Konvertierungsdateien auf der Festplatte statt im Arbeitsspeicher speichern", "fr": "Stocker les fichiers temporaires de conversion sur le disque plutôt qu’en mémoire", "es": "Guardar los archivos temporales de conversión en el disco en lugar de en la memoria", "it": "Salvare i file temporanei di conversione su disco invece che in memoria"}
  maintainer_url: https://github.com/C4illin/ConvertX
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: app-privilege
capabilities: {}
compose:
  sdk: 0.53.25
  resource_prefix: spl-convertx-
  files: [compose.yaml]
  services:
    convertx:
      # Conversion temp files go to disk (package UID, 0700, emptied each start).
      scratch: [/tmp]
      storage_init:
        directories:
          - {base: /var/tmp, path: convertx}
          - {base: /var/tmp, path: convertx/data}
          - {base: /var/tmp, path: convertx/home}
          - {base: /var/tmp, path: convertx/cache}
          - {base: /var/tmp, path: convertx/config}
          - {base: /var/tmp, path: convertx/public}
        runtime:
          prepare:
            - argv: [/bin/cp, -R, /app/public/., /var/tmp/convertx/public/]
  web:
    service: convertx
    port: 3000
    health: {path: /synopkgland/SynoPkgConvertX/healthcheck, status: 200}
  network: {egress: isolated}
identity_gateway:
  sdk: 0.53.25
  mode: none
  access: dsm-users
  ingress: {path: /synopkgland/SynoPkgConvertX/}
  session_ttl: 900
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 轉換文件、圖片、音訊與影片的檔案格式
