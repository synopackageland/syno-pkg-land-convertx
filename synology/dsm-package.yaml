schema: 2
package: SynoPkgConvertX
version: 0.19.0
build: 1
displayname: ConvertX
icon: assets/icon.png
description: Convert files with DSM login. Authorized users share one space and can see each other's files.
maintainer: synopackageland
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: app-privilege
capabilities: {}
compose:
  sdk: 0.21.0
  resource_prefix: spl-convertx-
  startup_timeout_seconds: 900
  files: [compose.yaml]
  services:
    convertx:
      storage_init:
        directories:
          - {base: /var/tmp, path: convertx}
          - {base: /var/tmp, path: convertx/data}
          - {base: /var/tmp, path: convertx/home}
          - {base: /var/tmp, path: convertx/cache}
          - {base: /var/tmp, path: convertx/config}
          - {base: /var/tmp, path: convertx/public}
        runtime:
          prepare:
            - argv: [/bin/cp, -R, /app/public/., /var/tmp/convertx/public/]
  web:
    service: convertx
    port: 3000
    health: {path: /healthcheck, status: 200}
  network: {egress: isolated}
identity_gateway:
  sdk: 0.21.0
  mode: none
  access: dsm-users
  listen: {https: 29443}
  session_ttl: 900
ui: {launch: new-page}
