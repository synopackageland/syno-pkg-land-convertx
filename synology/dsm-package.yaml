schema: 2
package: SynoPkgConvertX
version: 0.20.0
build: 8
displayname: ConvertX
icon: assets/icon.png
description: Convert documents, images, audio and video between file formats
maintainer: Emrik Östling
metadata:
  changelog: {"en": "Improve page loading reliability when signing in", "zh-TW": "改善登入時頁面載入的穩定性", "zh-CN": "改善登录时页面加载的稳定性", "ja": "サインイン時のページ読み込みの安定性を改善", "ko": "로그인 시 페이지 로딩 안정성 개선", "de": "Zuverlässigkeit beim Laden von Seiten während der Anmeldung verbessern", "fr": "Améliorer la fiabilité du chargement des pages lors de la connexion", "es": "Mejorar la fiabilidad de la carga de páginas al iniciar sesión", "it": "Migliorare l’affidabilità del caricamento delle pagine durante l’accesso"}
  maintainer_url: https://github.com/C4illin/ConvertX
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: app-privilege
capabilities: {}
compose:
  sdk: 0.53.21
  resource_prefix: spl-convertx-
  files: [compose.yaml]
  services:
    convertx:
      storage_init:
        directories:
          - {base: /var/tmp, path: convertx}
          - {base: /var/tmp, path: convertx/data}
          - {base: /var/tmp, path: convertx/home}
          - {base: /var/tmp, path: convertx/cache}
          - {base: /var/tmp, path: convertx/config}
          - {base: /var/tmp, path: convertx/public}
        runtime:
          prepare:
            - argv: [/bin/cp, -R, /app/public/., /var/tmp/convertx/public/]
  web:
    service: convertx
    port: 3000
    health: {path: /synopkgland/SynoPkgConvertX/healthcheck, status: 200}
  network: {egress: isolated}
identity_gateway:
  sdk: 0.53.21
  mode: none
  access: dsm-users
  ingress: {path: /synopkgland/SynoPkgConvertX/}
  session_ttl: 900
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 轉換文件、圖片、音訊與影片的檔案格式
