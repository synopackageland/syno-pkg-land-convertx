# Official image, unchanged; the SDK sets the actual package UID/GID.
services:
  convertx:
    image: c4illin/convertx:v0.19.0@sha256:8590a21a16adb8514a8be55b74ad0112bf58ba772328a53f7b40528fcf8fa013
    user: "${SYNOPKGLAND_UID}:${SYNOPKGLAND_GID}"
    entrypoint: [/entrypoint.sh]
    command: [bun, run, dist/src/index.js]
    working_dir: /app
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ALLOW_UNAUTHENTICATED: 'true'
      UNAUTHENTICATED_USER_SHARING: 'true'
      ACCOUNT_REGISTRATION: 'false'
      HTTP_ALLOWED: 'false'
      AUTO_DELETE_EVERY_N_HOURS: '24'
      MAX_CONVERT_PROCESS: '2'
      HOME: /app/data/home
      XDG_CACHE_HOME: /app/data/cache
      XDG_CONFIG_HOME: /app/data/config
      USER: convertx
      LOGNAME: convertx
      TZ: UTC
      BRANDING: "ConvertX — shared space / 共用空間（彼此看得到檔案）"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
    restart: unless-stopped
    stop_grace_period: 45s
